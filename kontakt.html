<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f0f0f0;
        }
        footer {
            background-color: #004080;
            color: white;
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#004080;">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">PlastikaPro</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#meni">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="meni">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Naslovna</a></li>
                <li class="nav-item"><a class="nav-link" href="onama.html">O nama</a></li>
                <li class="nav-item"><a class="nav-link active" href="kontakt.html">Kontakt</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- NASLOV -->
<div class="container my-5">
    <div class="card p-4 shadow-sm text-center">
        <h1>Kontaktirajte nas</h1>
        <p>Imate pitanje? Pošaljite nam poruku.</p>
    </div>
</div>

<!-- FORMA -->
<div class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4 shadow-sm">
                <form>
                    <div class="mb-3">
                        <label class="form-label">Ime i prezime</label>
                        <input type="text" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email adresa</label>
                        <input type="email" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Poruka</label>
                        <textarea class="form-control" rows="5" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Pošalji
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- KONTAKT INFO -->
<div class="container mb-5">
    <div class="card p-4 shadow-sm">
        <h4>Kontakt informacije</h4>
        <p class="mb-1">📧 Email: info@plastikapro.rs</p>
        <p class="mb-1">📞 Telefon: +381 21 123 4567</p>
        <p class="mb-0">📍 Adresa: Industrijska zona, Novi Sad, Srbija</p>
    </div>
</div>

<!-- FOOTER -->
<footer class="text-center py-3">
    <p class="mb-0">&copy; 2025 PlastikaPro</p>
</footer>
